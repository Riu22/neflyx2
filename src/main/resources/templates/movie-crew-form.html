<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Gestionar Crew - Neflyx2</title>
    <style>
        :root {
            --primary: #e50914;
            --bg: #141414;
            --surface: #1f1f1f;
            --text: #ffffff;
            --border: #333;
        }

        body {
            background-color: var(--bg);
            color: var(--text);
            font-family: 'Segoe UI', sans-serif;
            padding: 40px;
        }

        .container {
            max-width: 600px;
            margin: 0 auto;
            background: var(--surface);
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
        }

        h2 { border-bottom: 2px solid var(--primary); padding-bottom: 10px; margin-bottom: 25px; }

        .form-group { margin-bottom: 20px; }

        label { display: block; margin-bottom: 8px; color: #b3b3b3; font-size: 14px; }

        .filter-input, .filter-select {
            background: #2a2a2a;
            border: 1px solid var(--border);
            color: white;
            padding: 12px;
            border-radius: 4px;
            width: 100%;
            box-sizing: border-box;
        }

        .btn-save {
            background: var(--primary);
            color: white;
            border: none;
            padding: 15px;
            font-weight: bold;
            cursor: pointer;
            border-radius: 4px;
            width: 100%;
            transition: 0.3s;
            margin-top: 10px;
        }

        .btn-save:hover { opacity: 0.8; }

        .btn-cancel {
            display: block;
            text-align: center;
            text-decoration: none;
            color: #b3b3b3;
            margin-top: 15px;
            font-size: 14px;
        }
    </style>
</head>
<body>
<div class="container">
    <h2 th:text="${item.movie != null ? 'Equipo de: ' + item.movie.title : 'Asignar Personal'}"></h2>

    <form th:action="@{/admin/save/movie_crew}" th:object="${item}" method="post">
        <input type="hidden" name="movieId" th:value="${movieId}">

        <div class="form-group">
            <label>Película:</label>
            <select th:field="*{movie.movie_id}" class="filter-select" required>
                <option th:each="m : ${movies}" th:value="${m.movie_id}" th:text="${m.title}"></option>
            </select>
        </div>

        <div class="form-group">
            <label>Trabajador (Persona):</label>
            <select th:field="*{person.person_id}" class="filter-select" required>
                <option value="">Selecciona una persona...</option>
                <option th:each="p : ${persons}" th:value="${p.person_id}" th:text="${p.person_name}"></option>
            </select>
        </div>

        <div class="form-group">
            <label>Departamento:</label>
            <select th:field="*{department.department_id}" class="filter-select" required>
                <option th:each="d : ${departments}" th:value="${d.department_id}" th:text="${d.department_name}"></option>
            </select>
        </div>

        <div class="form-group">
            <label>Trabajo específico (Job):</label>
            <input type="text" th:field="*{job}" class="filter-input" required>
        </div>

        <button type="submit" class="btn-save">💾 Guardar en el Crew</button>
        <a th:href="@{'/admin/list/movie_crew' + (${movieId != null} ? '?movieId=' + ${movieId} : '')}"
           class="btn-cancel">Cancelar y volver</a>
    </form>
</div>

</body>
</html>
