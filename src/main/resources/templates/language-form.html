<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Gestionar Idioma - Neflyx2</title>
    <style>
        :root {
            --primary: #e50914;
            --bg: #141414;
            --surface: #1f1f1f;
            --text: #ffffff;
            --border: #333;
        }

        body {
            background-color: var(--bg);
            color: var(--text);
            font-family: 'Segoe UI', sans-serif;
            padding: 40px;
        }

        .container {
            max-width: 600px;
            margin: 0 auto;
            background: var(--surface);
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
        }

        h2 {
            border-bottom: 2px solid var(--primary);
            padding-bottom: 10px;
            margin-bottom: 25px;
        }

        .form-group { margin-bottom: 20px; }

        label {
            display: block;
            margin-bottom: 8px;
            color: #b3b3b3;
            font-size: 14px;
        }

        .filter-input {
            background: #2a2a2a;
            border: 1px solid var(--border);
            color: white;
            padding: 12px;
            border-radius: 4px;
            width: 100%;
            box-sizing: border-box;
        }

        .btn-save {
            background: var(--primary);
            color: white;
            border: none;
            padding: 15px;
            font-weight: bold;
            cursor: pointer;
            border-radius: 4px;
            width: 100%;
            transition: 0.3s;
            margin-top: 10px;
        }

        .btn-save:hover { opacity: 0.8; }

        .btn-cancel {
            display: block;
            text-align: center;
            text-decoration: none;
            color: #b3b3b3;
            margin-top: 15px;
            font-size: 14px;
        }

        .help-text {
            font-size: 12px;
            color: #888;
            margin-top: 5px;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>Gestión de Idioma</h2>

    <form th:action="@{/admin/save/language}" th:object="${item}" method="post">

        <input type="hidden" th:field="*{language_id}" th:if="${item.language_id != null}">

        <div class="form-group">
            <label>Código del Idioma (ISO):</label>
            <input type="text"
                   th:field="*{language_code}"
                   class="filter-input"
                   placeholder="Ej: en, es, fr, de, ja..."
                   maxlength="10"
                   required>
            <div class="help-text">
                Código ISO 639-1 (2 letras) o ISO 639-2 (3 letras). Ej: en, es, fr, de, ja
            </div>
        </div>

        <div class="form-group">
            <label>Nombre del Idioma:</label>
            <input type="text"
                   th:field="*{language_name}"
                   class="filter-input"
                   placeholder="Ej: English, Español, Français..."
                   required>
        </div>

        <button type="submit" class="btn-save">💾 Guardar Idioma</button>
        <a href="/admin/list/language" class="btn-cancel">Cancelar y volver</a>
    </form>
</div>

</body>
</html>
