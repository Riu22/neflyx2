<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Nuevo Cast - Neflyx2</title>
    <link rel="stylesheet" href="/style.css">
</head>
<body>
<div class="container">
    <form th:action="@{/admin/save/movie_cast}" th:object="${item}" method="post">

        <div class="header-info" style="margin-bottom: 25px;">
            <h2 th:text="${item.movie != null ? '🎭 Reparto: ' + item.movie.title : '🎭 Asignar Nuevo Actor'}"></h2>
            <p style="color: #888; font-size: 0.9em;">Introduce los datos del actor y su personaje en esta producción.</p>
        </div>

        <div class="form-group" style="margin-bottom: 15px;">
            <label style="font-weight: bold; display: block; margin-bottom: 5px;">🎬 Película Destino:</label>

            <div th:if="${movieId != null}">
                <select class="filter-select"
                        style="width: 100%; background: #2a2a2a; color: #eee; cursor: not-allowed;"
                        disabled>
                    <option th:value="${item.movie.movie_id}"
                            th:text="${item.movie.title}" selected></option>
                </select>
                <input type="hidden" name="movie.movie_id" th:value="${item.movie.movie_id}">
            </div>

            <div th:if="${movieId == null}">
                <select th:field="*{movie.movie_id}" class="filter-select" style="width: 100%;" required>
                    <option value="" disabled selected>Seleccione una película...</option>
                    <option th:each="m : ${movies}" th:value="${m.movie_id}" th:text="${m.title}"></option>
                </select>
            </div>
        </div>

        <div class="form-group" style="margin-bottom: 15px;">
            <label style="font-weight: bold; display: block; margin-bottom: 5px;">👤 Actor / Actriz:</label>
            <select th:field="*{person.person_id}" class="filter-select" style="width: 100%;" required>
                <option value="" disabled selected>Seleccione una persona...</option>
                <option th:each="p : ${persons}" th:value="${p.person_id}" th:text="${p.person_name}"></option>
            </select>
        </div>

        <div class="form-group" style="margin-bottom: 15px;">
            <label style="font-weight: bold; display: block; margin-bottom: 5px;">🚻 Género:</label>
            <select th:field="*{gender.gender_id}" class="filter-select" style="width: 100%;">
                <option th:each="g : ${genders}" th:value="${g.gender_id}" th:text="${g.gender_name}"></option>
            </select>
        </div>

        <div class="form-group" style="margin-bottom: 15px;">
            <label style="font-weight: bold; display: block; margin-bottom: 5px;">🎭 Nombre del Personaje:</label>
            <input type="text" th:field="*{character_name}" class="filter-select" style="width: 100%;" placeholder="Ej: Forrest Gump" required>
        </div>

        <div style="margin-top: 20px;">
            <button type="submit" class="btn-save" style="background: #e50914; color: white; padding: 10px 20px; border: none; border-radius: 4px; cursor: pointer;">
                💾 Guardar Reparto
            </button>
            <a th:href="@{/admin/list/movie_cast(movieId=${movieId})}" style="color: #ccc; margin-left: 15px; text-decoration: none;">Cancelar</a>
        </div>

    </form>
</div>
</body>
</html>
