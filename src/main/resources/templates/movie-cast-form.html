<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Nuevo Cast - Neflyx2</title>
    <link rel="stylesheet" href="/style.css">
</head>
<body>
<div class="container">
    <h2>Asignar Actor a Película</h2>

    <form th:action="@{/admin/save/movie_cast}" method="post" class="filters-section" style="display: block;">

        <!-- ✅ PELÍCULA -->
        <div style="margin-bottom: 15px;">
            <label>Película:</label><br>
            <select name="movie.movie_id" class="filter-select" style="width: 100%;" required>
                <option value="" disabled th:selected="${item.movie == null}">
                    Seleccione una película...
                </option>
                <option th:each="m : ${movies}"
                        th:value="${m.movie_id}"
                        th:text="${m.title}"
                        th:selected="${item.movie != null && item.movie.movie_id == m.movie_id}">
                </option>
            </select>
        </div>

        <!-- ✅ PERSONA (Actor) -->
        <div style="margin-bottom: 15px;">
            <label>Persona (Actor):</label><br>
            <select name="person.person_id" class="filter-select" style="width: 100%;" required>
                <option value="" disabled th:selected="${item.person == null}">
                    Seleccione un actor...
                </option>
                <option th:each="p : ${persons}"
                        th:value="${p.person_id}"
                        th:text="${p.person_name}"
                        th:selected="${item.person != null && item.person.person_id == p.person_id}">
                </option>
            </select>
        </div>

        <!-- ✅ NOMBRE DEL PERSONAJE -->
        <div style="margin-bottom: 15px;">
            <label>Nombre del Personaje:</label><br>
            <input type="text" name="character_name"
                   th:value="${item.character_name}"
                   class="filter-input"
                   style="width: 100%;"
                   placeholder="Ej: Tony Stark"
                   required>
        </div>

        <!-- ✅ GÉNERO (Opcional) -->
        <div style="margin-bottom: 15px;">
            <label>Género (Opcional):</label><br>
            <select name="gender.gender_id" class="filter-select" style="width: 100%;">
                <option value="" th:selected="${item.gender == null}">
                    Desconocido
                </option>
                <option th:each="g : ${genders}"
                        th:value="${g.gender_id}"
                        th:text="${g.gender}"
                        th:selected="${item.gender != null && item.gender.gender_id == g.gender_id}">
                </option>
            </select>
        </div>

        <button type="submit" class="btn-search">Guardar Reparto</button>
        <a href="/admin/list/movie_cast" class="btn-search" style="background:#444; text-decoration:none; display:inline-block; text-align:center;">Cancelar</a>
    </form>
</div>
</body>
</html>
