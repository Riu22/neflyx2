<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro - Neflyx2 Blue</title>
    <style>
        :root {
            /* Cambiado a un Azul Oscuro Profundo */
            --primary: #003366;
            --primary-hover: #004080;
            --bg: #000000;
            --surface: #121212; /* Gris casi negro para que destaque sobre el fondo */
            --text: #ffffff;
            --text-dim: #b0b0b0;
            --input-bg: #1e1e1e;
            --input-focus: #2a2a2a;
        }

        body {
            background-color: var(--bg);
            color: var(--text);
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .register-container {
            background-color: var(--surface);
            padding: 50px 60px;
            border-radius: 8px;
            width: 100%;
            max-width: 450px;
            box-sizing: border-box;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
            border: 1px solid #222; /* Borde sutil para dar relieve */
        }

        h1 {
            margin-top: 0;
            margin-bottom: 30px;
            font-size: 28px;
            font-weight: 600;
            text-align: center;
        }

        .form-group {
            margin-bottom: 20px;
        }

        input[type="text"],
        input[type="password"],
        input[type="email"] {
            width: 100%;
            padding: 14px 18px;
            background: var(--input-bg);
            border: 1px solid #333;
            border-radius: 6px;
            color: white;
            font-size: 15px;
            box-sizing: border-box;
            outline: none;
            transition: all 0.3s ease;
        }

        input:focus {
            background: var(--input-focus);
            border-color: var(--primary); /* El borde se ilumina en azul */
        }

        input[type="submit"] {
            width: 100%;
            padding: 14px;
            background-color: var(--primary);
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            margin-top: 10px;
            transition: background 0.3s ease;
        }

        input[type="submit"]:hover {
            background-color: var(--primary-hover);
        }

        .footer-links {
            margin-top: 25px;
            color: var(--text-dim);
            font-size: 14px;
            text-align: center;
        }

        .footer-links a {
            color: #4da6ff; /* Azul claro para los enlaces */
            text-decoration: none;
            font-weight: 500;
        }

        .footer-links a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>

<div class="register-container">
    <h1>Crear cuenta</h1>

    <form th:action="@{/register}" method="post">
        <div class="form-group">
            <input type="text" id="username" name="username" placeholder="Nombre de usuario" required>
        </div>

        <div class="form-group">
            <input type="email" id="email" name="email" placeholder="Correo electrónico" required>
        </div>

        <div class="form-group">
            <input type="password" id="password" name="password" placeholder="Contraseña" required>
        </div>

        <input type="submit" value="Registrarse">
    </form>

    <div class="footer-links">
        ¿Ya eres miembro? <a th:href="@{/neflyx2/login}">Inicia sesión</a>.
    </div>
</div>

</body>
</html>
