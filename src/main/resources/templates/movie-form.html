<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Gestionar Película - Neflyx2</title>
    <style>
        :root {
            --primary: #e50914;
            --bg: #141414;
            --surface: #1f1f1f;
            --text: #ffffff;
            --border: #333;
        }

        body {
            background-color: var(--bg);
            color: var(--text);
            font-family: 'Segoe UI', sans-serif;
            padding: 40px;
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
            background: var(--surface);
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
        }

        h2 { border-bottom: 2px solid var(--primary); padding-bottom: 10px; margin-bottom: 25px; }

        .form-group { margin-bottom: 15px; }

        label { display: block; margin-bottom: 5px; color: #b3b3b3; font-size: 14px; }

        .filter-input, .filter-select {
            background: #2a2a2a;
            border: 1px solid var(--border);
            color: white;
            padding: 10px;
            border-radius: 4px;
            box-sizing: border-box;
        }

        /* Estilo para los Checkboxes de Géneros */
        .genres-container {
            background: #111;
            padding: 15px;
            border-radius: 4px;
            border: 1px solid var(--border);
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
            gap: 10px;
            max-height: 200px;
            overflow-y: auto;
        }

        .genre-item {
            display: flex;
            align-items: center;
            font-size: 14px;
            cursor: pointer;
        }

        .genre-item input { margin-right: 8px; accent-color: var(--primary); }

        .btn-search {
            background: var(--primary);
            color: white;
            border: none;
            padding: 12px;
            font-weight: bold;
            cursor: pointer;
            border-radius: 4px;
            transition: 0.3s;
        }

        .btn-search:hover { opacity: 0.8; }
    </style>
</head>
<body>

<div class="container">
    <h2 th:text="${item == null ? 'Nueva Película' : 'Editar Película'}"></h2>

    <form th:action="@{/admin/save/movie}" th:object="${item}" method="post">

        <input type="hidden" th:field="*{movie_id}">

        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 20px;">
            <div class="form-group">
                <label>Título:</label>
                <input type="text" th:field="*{title}" class="filter-input" style="width: 100%;" required>
            </div>
            <div class="form-group">
                <label>Estado:</label>
                <input type="text" th:field="*{movie_status}" class="filter-input" style="width: 100%;">
            </div>
            <div class="form-group">
                <label>Presupuesto ($):</label>
                <input type="number" th:field="*{budget}" class="filter-input" style="width: 100%;">
            </div>
            <div class="form-group">
                <label>Fecha Estreno:</label>
                <input type="date" th:field="*{release_date}" class="filter-input" style="width: 100%;">
            </div>
        </div>

        <div class="form-group">
            <label>Sinopsis:</label>
            <textarea th:field="*{overview}" class="filter-input" style="width: 100%; height: 80px;"></textarea>
        </div>

        <div class="form-group">
            <label style="color: var(--primary); font-weight: bold;">Géneros:</label>
            <div class="genres-container">
                <div th:each="g : ${allGenres}" class="genre-item">
                    <input type="checkbox"
                           th:field="*{genres}"
                           th:value="${g.genre_id}">
                    <span th:text="${g.genre_name}"></span>
                </div>
            </div>
        </div>

        <div style="margin-top: 25px; display: flex; gap: 10px;">
            <button type="submit" class="btn-search" style="flex: 2;">💾 Guardar Película</button>
            <a href="/admin/list/movie" class="btn-search" style="background:#444; flex: 1; text-align:center; text-decoration:none;">❌ Cancelar</a>
        </div>
    </form>
</div>

</body>
</html>
