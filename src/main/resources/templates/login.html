<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Neflyx2 Blue</title>
    <style>
        :root {
            /* Mismas variables que el registro */
            --primary: #003366;
            --primary-hover: #004080;
            --bg: #000000;
            --surface: #121212;
            --text: #ffffff;
            --text-dim: #b0b0b0;
            --input-bg: #1e1e1e;
            --input-focus: #2a2a2a;
        }

        body {
            background-color: var(--bg);
            color: var(--text);
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .login-container {
            background-color: var(--surface);
            padding: 50px 60px;
            border-radius: 8px;
            width: 100%;
            max-width: 450px;
            box-sizing: border-box;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
            border: 1px solid #222;
        }

        h1 {
            margin-top: 0;
            margin-bottom: 30px;
            font-size: 28px;
            font-weight: 600;
            text-align: center;
        }

        .form-group {
            margin-bottom: 20px;
        }

        input[type="text"],
        input[type="password"] {
            width: 100%;
            padding: 14px 18px;
            background: var(--input-bg);
            border: 1px solid #333;
            border-radius: 6px;
            color: white;
            font-size: 15px;
            box-sizing: border-box;
            outline: none;
            transition: all 0.3s ease;
        }

        input:focus {
            background: var(--input-focus);
            border-color: var(--primary);
        }

        input[type="submit"] {
            width: 100%;
            padding: 14px;
            background-color: var(--primary);
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            margin-top: 10px;
            transition: background 0.3s ease;
        }

        input[type="submit"]:hover {
            background-color: var(--primary-hover);
        }

        .footer-links {
            margin-top: 25px;
            color: var(--text-dim);
            font-size: 14px;
            text-align: center;
        }

        .footer-links a {
            color: #4da6ff;
            text-decoration: none;
            font-weight: 500;
        }

        .footer-links a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>

<div class="login-container">
    <h1>Iniciar sesión</h1>

    <div th:if="${success}" style="color: #4caf50; margin-bottom: 15px;" th:text="${success}"></div>
    <div th:if="${error}" style="color: #e50914; margin-bottom: 15px;" th:text="${error}"></div>

    <form th:action="@{/login}" method="post">
        <div class="form-group">
            <input type="text" id="username" name="username" placeholder="Usuario o email" required>
        </div>

        <div class="form-group">
            <input type="password" id="password" name="password" placeholder="Contraseña" required>
        </div>

        <input type="submit" value="Entrar">
    </form>

    <div class="footer-links">
        ¿Aún no tienes cuenta? <a th:href="@{/neflyx2/register}">Regístrate aquí</a>.
    </div>
</div>

</body>
</html>
