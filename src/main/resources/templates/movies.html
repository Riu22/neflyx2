<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Neflyx2 - Buscador Inteligente</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
</head>
<body>
<nav class="navbar" id="navbar">
    <div class="navbar-brand">NEFLYX2</div>
    <div class="navbar-links">
        <a th:if="${session.username == null}" href="/neflyx2/login">Iniciar sesión</a>
        <div th:if="${session.username != null}" class="user-info">
            <span th:text="'Hola, ' + ${session.username}"></span>
            <a href="/logout" style="margin-left: 15px;">Cerrar sesión</a>
        </div>
    </div>
</nav>

<div class="container">
    <div class="filters-section">
        <div class="filters-title">Explorar Catálogo</div>
        <div class="filter-grid">
            <input type="text" id="keyword" class="filter-input" placeholder="Título de película..." list="suggestions-list">

            <input type="number" id="year" class="filter-input" placeholder="Año" min="1900" max="2026">

            <select id="genre" class="filter-select">
                <option value="">Todos los géneros</option>
                <option th:each="g : ${genres_list}" th:value="${g.genre_name}" th:text="${g.genre_name}"></option>
            </select>

            <input type="text" id="director" class="filter-input" placeholder="Director" list="suggestions-list">
            <input type="text" id="actor" class="filter-input" placeholder="Actor" list="suggestions-list">
            <input type="text" id="character" class="filter-input" placeholder="Personaje">
        </div>

        <datalist id="suggestions-list"></datalist>

        <div class="button-group" style="display: flex; gap: 10px; margin-top: 15px;">
            <button class="btn-search" onclick="searchMovies(0)" style="flex: 2;">Buscar Películas</button>
            <a th:if="${session.username != null}"
               href="/admin/dashboard"
               class="btn-search"
               style="flex: 1; text-align: center; text-decoration: none; background-color: #444;">
                Panel Admin
            </a>
        </div>
    </div>

    <div class="loading" id="loading" style="display: none;">
        <div class="loading-spinner"></div>
        Buscando en la base de datos...
    </div>

    <div id="resultsSection" style="display: none;">
        <h2 class="section-title" id="sectionTitle">Resultados</h2>
        <div class="movie-grid" id="movieGrid"></div>
    </div>

    <div id="welcomeMessage">
        <div class="no-results">
            <div class="no-results-icon">🎬</div>
            <p>Escribe el nombre de una película, actor o director para comenzar.</p>
        </div>
    </div>

    <div class="pagination" id="pagination" style="display: none;"></div>
</div>

<script src="index.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@tarekraafat/autocomplete.js@10.2.7/dist/autoComplete.min.js"></script>
</body>
</html>
