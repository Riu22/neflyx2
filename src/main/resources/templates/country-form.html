<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestión de País - Neflyx2</title>
    <style>
        :root {
            --primary: #003366;
            --primary-hover: #004080;
            --bg: #000000;
            --surface: #121212;
            --text: #ffffff;
            --text-dim: #b0b0b0;
            --input-bg: #1e1e1e;
            --border: #333333;
        }

        body {
            background-color: var(--bg);
            color: var(--text);
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .form-container {
            background-color: var(--surface);
            padding: 40px;
            border-radius: 8px;
            width: 100%;
            max-width: 500px;
            box-sizing: border-box;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            border: 1px solid #222;
        }

        h2 {
            margin-top: 0;
            margin-bottom: 25px;
            font-size: 24px;
            font-weight: 600;
            text-align: center;
            color: var(--text);
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            color: var(--text-dim);
            font-size: 14px;
        }

        input[type="text"],
        input[type="number"] {
            width: 100%;
            padding: 12px 15px;
            background: var(--input-bg);
            border: 1px solid var(--border);
            border-radius: 6px;
            color: white;
            font-size: 15px;
            box-sizing: border-box;
            outline: none;
            transition: all 0.3s ease;
        }

        input:focus {
            border-color: var(--primary);
            background: #252525;
        }

        .button-group {
            display: flex;
            gap: 10px;
            margin-top: 30px;
        }

        .btn {
            flex: 1;
            padding: 12px;
            border-radius: 6px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            text-align: center;
            text-decoration: none;
            transition: 0.3s;
            border: none;
        }

        .btn-save {
            background-color: var(--primary);
            color: white;
        }

        .btn-save:hover {
            background-color: var(--primary-hover);
        }

        .btn-cancel {
            background-color: #333;
            color: white;
        }

        .btn-cancel:hover {
            background-color: #444;
        }

        .info-text {
            font-size: 12px;
            color: var(--text-dim);
            margin-top: 5px;
        }
    </style>
</head>
<body>

<div class="form-container">
    <h2 th:text="${item.country_id == null ? 'Nuevo País' : 'Editar País'}">País</h2>

    <form th:action="@{/admin/save/country}" th:object="${item}" method="post">

        <input type="hidden" th:field="*{country_id}" />

        <div class="form-group">
            <label for="country_name">Nombre del País</label>
            <input type="text" th:field="*{country_name}" id="country_name" placeholder="Ej: España" required>
        </div>

        <div class="form-group">
            <label for="country_iso_code">Código ISO</label>
            <input type="text" th:field="*{country_iso_code}" id="country_iso_code" placeholder="Ej: ES" maxlength="3" required>
            <p class="info-text">Código estándar de 2 o 3 letras.</p>
        </div>

        <div class="button-group">
            <button type="submit" class="btn btn-save">Guardar Cambios</button>
            <a th:href="@{/admin/list/country}" class="btn btn-cancel">Cancelar</a>
        </div>
    </form>
</div>

</body>
</html>
