<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Administración - Neflyx2</title>
    <style>
        :root {
            --primary: #e50914;
            --bg: #141414;
            --surface: #1f1f1f;
            --text: #ffffff;
            --text-dim: #b3b3b3;
            --border: #333333;
        }

        body {
            background-color: var(--bg);
            color: var(--text);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 20px;
        }

        .container {
            max-width: 1100px;
            margin: 0 auto;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
            border-bottom: 1px solid var(--border);
            padding-bottom: 15px;
        }

        h2 { text-transform: uppercase; letter-spacing: 1px; }

        .btn {
            padding: 10px 20px;
            border-radius: 4px;
            text-decoration: none;
            font-weight: bold;
            font-size: 14px;
            transition: 0.3s;
            display: inline-block;
        }

        .btn-add { background-color: var(--primary); color: white; }
        .btn-back { background-color: #444; color: white; margin-right: 10px; }
        .btn:hover { opacity: 0.8; transform: translateY(-1px); }

        table {
            width: 100%;
            border-collapse: collapse;
            background-color: var(--surface);
            border-radius: 8px;
            overflow: hidden;
        }

        th {
            background-color: #2a2a2a;
            color: var(--text-dim);
            text-align: left;
            padding: 15px;
            font-size: 13px;
            text-transform: uppercase;
        }

        td {
            padding: 15px;
            border-bottom: 1px solid var(--border);
            font-size: 14px;
        }

        tr:hover { background-color: #252525; }

        .badge {
            background: #333;
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 12px;
            color: var(--text-dim);
        }

        .actions a {
            text-decoration: none;
            font-size: 18px;
            margin-right: 15px;
            display: inline-block;
        }

        .edit-link { color: #007bff; }
        .delete-link { color: var(--primary); }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <h2 th:text="'Gestión de ' + ${entityName}">Entidad</h2>
        <div>
            <a href="/admin/dashboard" class="btn btn-back">⬅ Volver</a>

            <a th:if="${entityName == 'movie_cast'}" th:href="@{/admin/movie_cast/new}" class="btn btn-add">+ Nuevo Reparto</a>
            <a th:if="${entityName == 'movie_crew'}" th:href="@{/admin/movie_crew/new}" class="btn btn-add">+ Nuevo Crew</a>
            <a th:if="${entityName != 'movie_cast' && entityName != 'movie_crew'}"
               th:href="@{/admin/edit/{e}/0(e=${entityName})}" class="btn btn-add">+ Añadir Registro</a>
        </div>
    </div>

    <table>
        <thead>
        <tr>
            <th>ID</th>
            <th>Información Principal</th>
            <th>Atributos / Relación</th>
            <th style="text-align: center;">Acciones</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="obj : ${items}">

            <td>
                <span class="badge" th:text="${obj.id}">ID</span>
            </td>

            <td>
                <strong th:text="${obj.mainInfo}">Información</strong>
            </td>

            <td>
                <span th:text="${obj.secondaryInfo}">Atributos</span>
            </td>

            <td class="actions" style="text-align: center;">
                <a th:href="@{/admin/edit/{e}/{id}(e=${entityName}, id=${obj.id})}"
                   class="edit-link" title="Editar">✏️</a>

                <a th:href="@{/admin/delete/{e}/{id}(e=${entityName}, id=${obj.id})}"
                   class="delete-link" title="Borrar"
                   onclick="return confirm('¿Eliminar registro?')">🗑️</a>
            </td>
        </tr>
        </tbody>
    </table>
</div>

</body>
</html>
