<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Lista - Neflyx2</title>
    <style>
        :root {
            --primary: #e50914;
            --bg: #141414;
            --surface: #1f1f1f;
            --text: #ffffff;
            --border: #333;
        }

        body { background: var(--bg); color: var(--text); font-family: 'Segoe UI', sans-serif; padding: 30px; }
        .container { max-width: 900px; margin: 0 auto; }
        h2 { border-bottom: 2px solid var(--primary); padding-bottom: 10px; margin-bottom: 20px; }

        .btn-primary {
            background: var(--primary); color: white; border: none;
            padding: 10px 18px; font-weight: bold; cursor: pointer;
            border-radius: 4px; text-decoration: none; font-size: 13px;
            display: inline-block; transition: 0.3s;
        }
        .btn-primary:hover { opacity: 0.8; }

        /* ========== BUSCADOR ========== */
        .search-bar {
            display: flex; gap: 10px; margin-bottom: 20px;
            background: var(--surface); padding: 15px;
            border-radius: 8px; border: 1px solid var(--primary);
        }
        .search-bar input {
            flex: 1; background: #2a2a2a; border: 1px solid var(--border);
            color: white; padding: 10px 14px; border-radius: 6px; font-size: 14px;
        }
        .search-bar button {
            background: var(--primary); color: white; border: none;
            padding: 10px 18px; border-radius: 6px; cursor: pointer;
            font-weight: bold; font-size: 14px;
        }

        /* ========== TABLA ========== */
        .table-wrap {
            background: var(--surface); border-radius: 8px;
            overflow: hidden; box-shadow: 0 4px 15px rgba(0,0,0,0.4);
        }
        table { width: 100%; border-collapse: collapse; }
        th {
            background: #111; color: #888; font-size: 12px;
            letter-spacing: 1px; text-transform: uppercase;
            padding: 12px 15px; text-align: left;
        }
        td { padding: 12px 15px; border-bottom: 1px solid #222; font-size: 14px; }
        tr:hover td { background: #252525; }

        .td-actions { display: flex; gap: 8px; }
        .btn-edit {
            background: #1a3a5c; color: #6ab4ff; border: 1px solid #2a5a8c;
            padding: 5px 12px; border-radius: 4px; font-size: 12px;
            font-weight: bold; text-decoration: none;
        }
        .btn-delete {
            background: #3a1a1a; color: #ff8080; border: 1px solid #6a2a2a;
            padding: 5px 12px; border-radius: 4px; font-size: 12px;
            font-weight: bold; text-decoration: none; cursor: pointer;
        }

        .pagination {
            display: flex; align-items: center; gap: 10px;
            margin-top: 20px; justify-content: center;
        }
        .pagination a { background: #333; padding: 8px 14px; border-radius: 4px; text-decoration: none; color: white; }
        .pagination .current { background: var(--primary); padding: 8px 14px; border-radius: 4px; font-weight: bold; }
        .no-results { text-align: center; padding: 40px; color: #888; }
    </style>
</head>
<body>
<div class="container">

    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
        <h2>📋 <span th:text="${entityName}"></span></h2>
        <div style="display: flex; gap: 10px;">
            <a th:href="@{/admin/edit/{entity}(entity=${entityName}, id='0', movieId=${movieId})}" class="btn-primary">
                ➕ Nuevo
            </a>
            <a th:href="@{/admin/dashboard}" class="btn-primary" style="background: #444;">
                ← Volver
            </a>
        </div>
    </div>

    <div th:if="${entityName == 'movie'}" class="search-bar">
        <input type="text" id="quickSearch" placeholder="🔍 Busca por título..." onkeyup="handleQuickSearch(event)">
        <button onclick="doQuickSearch()">Buscar</button>
        <button onclick="clearSearch()" style="background: #444;">✕ Limpiar</button>
    </div>

    <div id="quickSearchResults" style="display: none;">
        <div class="table-wrap" style="margin-bottom: 20px;">
            <table>
                <thead><tr><th>ID</th><th>Título</th><th>Año</th><th>Acciones</th></tr></thead>
                <tbody id="quickSearchBody"></tbody>
            </table>
        </div>
    </div>

    <div id="normalList">
        <div class="table-wrap">
            <table>
                <thead>
                <tr>
                    <th>ID</th>
                    <th>Nombre</th>
                    <th>Info</th>
                    <th>Acciones</th>
                </tr>
                </thead>
                <tbody>
                <tr th:if="${#lists.isEmpty(items)}">
                    <td colspan="4" class="no-results">No hay registros</td>
                </tr>
                <tr th:each="item : ${items}">
                    <td th:text="${item.id}" style="color: #888; font-size: 12px;"></td>
                    <td th:text="${item.mainInfo}" style="font-weight: 600;"></td>
                    <td th:text="${item.secondaryInfo}" style="color: #888; font-size: 12px;"></td>
                    <td>
                        <div class="td-actions">
                            <a th:href="@{/admin/edit/{entity}(entity=${entityName}, id=${item.id}, movieId=${movieId})}"
                               class="btn-edit">✏️ Editar</a>

                            <a th:href="@{/admin/delete/{entity}(entity=${entityName}, id=${item.id}, movieId=${movieId})}"
                               class="btn-delete"
                               onclick="return confirm('¿Eliminar este registro?')">🗑️ Borrar</a>
                        </div>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>

        <div class="pagination" th:if="${totalPages > 1}">
            <a th:if="${currentPage > 0}" th:href="@{/admin/list/{entity}(entity=${entityName}, page=${currentPage - 1}, movieId=${movieId})}">← Anterior</a>
            <span class="current" th:text="'Página ' + (${currentPage + 1}) + ' de ' + ${totalPages}"></span>
            <a th:if="${currentPage + 1 < totalPages}" th:href="@{/admin/list/{entity}(entity=${entityName}, page=${currentPage + 1}, movieId=${movieId})}">Siguiente →</a>
        </div>
    </div>
</div>

<script>
    let searchTimeout = null;

    function handleQuickSearch(event) {
        clearTimeout(searchTimeout);
        searchTimeout = setTimeout(() => {
            const val = document.getElementById('quickSearch').value.trim();
            if (val.length >= 2) doQuickSearch();
            else clearSearch();
        }, 400);
    }

    async function doQuickSearch() {
        const keyword = document.getElementById('quickSearch').value.trim();
        if (!keyword || keyword.length < 2) return;

        try {
            const response = await fetch(`/movies/search?keyword=${encodeURIComponent(keyword)}&size=20&page=0`);
            const data = await response.json();
            const movies = data.content;

            const tbody    = document.getElementById('quickSearchBody');
            const results  = document.getElementById('quickSearchResults');
            const normal   = document.getElementById('normalList');

            if (!movies || movies.length === 0) {
                tbody.innerHTML = `<tr><td colspan="4" class="no-results">😔 No se encontraron películas</td></tr>`;
            } else {
                tbody.innerHTML = movies.map(movie => {
                    const year = movie.releaseDate ? new Date(movie.releaseDate).getFullYear() : 'N/A';
                    return `
                        <tr>
                            <td style="color:#888; font-size:12px;">${movie.movieId}</td>
                            <td style="font-weight:600;">${escapeHtml(movie.title)}</td>
                            <td style="color:#888; font-size:12px;">${year}</td>
                            <td>
                                <div class="td-actions">
                                    <a href="/admin/edit/movie?id=${movie.movieId}" class="btn-edit">✏️ Editar</a>
                                    <a href="/admin/delete/movie?id=${movie.movieId}" class="btn-delete"
                                       onclick="return confirm('¿Eliminar esta película?')">🗑️ Borrar</a>
                                </div>
                            </td>
                        </tr>
                    `;
                }).join('');
            }
            results.style.display = 'block';
            normal.style.display  = 'none';
        } catch (error) { console.error('Error:', error); }
    }

    function clearSearch() {
        document.getElementById('quickSearch').value = '';
        document.getElementById('quickSearchResults').style.display = 'none';
        document.getElementById('normalList').style.display = 'block';
    }

    function escapeHtml(text) {
        if (!text) return '';
        const div = document.createElement('div');
        div.textContent = text;
        return div.innerHTML;
    }
</script>
</body>
</html>
